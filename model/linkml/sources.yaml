# Paths are relative to the workspace root passed to the command.
repositories:
  - id: repo:skupper-docs
    root: human/skupper-docs
    record: sources/skupper-docs.md
    required: true
    include:
      - input/refdog/concepts/listener.md
      - input/refdog/concepts/connector.md
      - input/refdog/concepts/routing-key.md
  - id: repo:hello-world
    root: human/skupper-example-hello-world
    record: sources/skupper-example-hello-world.md
    required: false
    include: []
  - id: repo:skupper
    root: human/skupper
    record: sources/skupper.md
    required: false
    include: []
  - id: repo:okf
    root: generated/concepts
    required: true
    include: [listener.md, connector.md, routing-key.md]
